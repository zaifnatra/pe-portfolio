name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem

          # Fail here (not with a vague "Permission denied") if the secret was
          # pasted without its line breaks or still has a passphrase.
          ssh-keygen -y -f ~/.ssh/deploy-key.pem > /dev/null

          cat >> ~/.ssh/config <<EOF
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking no
          EOF

      - name: Print project root directory
        env:
          PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
        run: ssh my-vps "cd '$PROJECT_ROOT' && pwd"
