version: "3"
services:
  myportfolio:
    container_name: myportfolio
    build: .
    restart: always
    env_file:
      - .env
    environment:
      # Where /health reads nginx's stub_status. Only set in production, since
      # local development runs without an nginx container.
      - NGINX_STATUS_URL=http://nginx:8080/nginx_status
    networks:
      # "monitoring" is only here so Prometheus can scrape /metrics; the app
      # still talks to mysql and nginx over the default network.
      - default
      - monitoring
    depends_on:
      - mysql

  mysql:
    container_name: mysql
    image: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mydatabase:/var/lib/mysql

  nginx:
    container_name: nginx
    image: jonasal/nginx-certbot
    restart: always
    environment:
      - CERTBOT_EMAIL=huzaifafareed817@gmail.com
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./user_conf.d:/etc/nginx/user_conf.d
    depends_on:
      - myportfolio

volumes:
  mydatabase:
  nginx_secrets:

networks:
  default:
  # Created by the monitoring stack (~/prometheus). Bring that stack up first,
  # or this compose file has no network to attach to.
  monitoring:
    external: true
    name: prometheus_back-tier
