# Prometheus configuration for the portfolio site's monitoring stack.
# Deployed to ~/prometheus/prometheus/prometheus.yml on the VPS by
# monitoring/deploy-monitoring.sh.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pe-portfolio'

rule_files:
  - 'alert.rules'

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # The Flask app. Scraped directly over the prometheus_back-tier network, so
  # /metrics never has to be exposed through nginx to the internet. Each scrape
  # also re-runs the app's dependency health checks, which is what keeps
  # portfolio_dependency_up fresh.
  - job_name: 'portfolio'
    static_configs:
      - targets: ['myportfolio:5000']
