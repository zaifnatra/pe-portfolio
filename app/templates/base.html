<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Portfolio of Huzaifa Fareed, software engineering student at Concordia and MLH Production Engineering Fellow."
    />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Portfolio of Huzaifa Fareed, software engineering student at Concordia and MLH Production Engineering Fellow."
    />
    <meta property="og:url" content="{{ url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/styles/main.css" />
    <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon" />
    <title>{{ title }}</title>

    <script>
      // Marks that JS is available, which is what switches the reveal
      // animations on. Without it the content renders plainly visible.
      document.documentElement.className += " js";
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="nav-bar">
      <div class="nav-content">
        <a class="nav-logo" href="/">huzaifa<sup>®</sup></a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <nav id="primary-nav" class="nav-links">
          {% for link in nav_links %}
            <a href="{{ link.url }}" class="nav-link {% if request.path == link.url %}active{% endif %}">
              {{ link.label }}
            </a>
          {% endfor %}
          <a class="btn btn-sm" href="/timeline">Get in touch</a>
        </nav>
      </div>
    </header>

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-logo">huzaifa<sup>®</sup></span>
        <span>Montréal · <span id="footer-year">2026</span></span>
      </div>
    </footer>

    <script>
      document.getElementById("footer-year").textContent = new Date().getFullYear();

      // Mobile nav
      const navToggle = document.querySelector(".nav-toggle");
      const navLinks = document.getElementById("primary-nav");
      navToggle.addEventListener("click", () => {
        const open = navLinks.classList.toggle("open");
        navToggle.classList.toggle("open", open);
        navToggle.setAttribute("aria-expanded", String(open));
      });

      // The header only grows its hairline border once the page has scrolled.
      const navBar = document.querySelector(".nav-bar");
      const onScroll = () => navBar.classList.toggle("scrolled", window.scrollY > 8);
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });

      // Reveal sections as they scroll into view. Anything already on screen
      // is shown immediately so nothing can be left hidden.
      const reveals = document.querySelectorAll(".reveal");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        reveals.forEach((el) => el.classList.add("visible"));
      } else {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0, rootMargin: "0px 0px -5% 0px" }
        );
        reveals.forEach((el) => observer.observe(el));
        // Safety net: if the observer never fires (very short pages, odd
        // layout timing), show everything rather than leave a blank section.
        window.setTimeout(() => reveals.forEach((el) => el.classList.add("visible")), 2500);
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
